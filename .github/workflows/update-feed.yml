name: Update IG Feeds Tiap Jam

on:
  schedule:
    - cron: '0 * * * *' # Berjalan setiap menit ke-0 setiap jam
  workflow_dispatch: # Memungkinkan Anda menekan tombol "Run" manual

jobs:
  scrape-instagram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Instaloader
        run: pip install instaloader

      - name: Jalankan Script Scraper
        run: python scraper.py

      - name: Commit dan Push Hasil JSON Baru
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add output/*.json
          git commit -m "Auto-update IG Feeds via Instaloader" || exit 0
          git push
