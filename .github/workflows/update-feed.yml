name: Update Instagram Feed

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install kebutuhan Python
        run: pip install -r requirements.txt

      - name: Generate feed Instagram
        run: python generate_feed.py

      - name: Simpan hasil feed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update Instagram feed
          file_pattern: output/*.json
