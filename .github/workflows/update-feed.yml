name: Update Instagram Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install kebutuhan Python
        run: pip install -r requirements.txt

      - name: Cek waktu workflow
        run: |
          date
          echo "Workflow otomatis/manual sedang berjalan"

      - name: Siapkan cookies Instagram
        env:
          IG_COOKIES_BASE64: ${{ secrets.IG_COOKIES_BASE64 }}
        run: |
          if [ -n "$IG_COOKIES_BASE64" ]; then
            echo "$IG_COOKIES_BASE64" | base64 -d > cookies.txt
            echo "cookies.txt berhasil dibuat"
          else
            echo "IG_COOKIES_BASE64 belum ada, lanjut tanpa cookies"
          fi

      - name: Generate feed Instagram
        timeout-minutes: 15
        run: python -u generate_feed.py

      - name: Cek hasil output
        run: |
          ls -lah output
          echo "Cek generated_at RS Unpad:"
          cat output/rsunpad.json | head -n 12

      - name: Simpan hasil feed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update Instagram feed
          file_pattern: output/*.json
