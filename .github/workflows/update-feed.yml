name: Update IG Feeds Tiap Jam via API

on:
  schedule:
    - cron: '0 * * * *' # Menjalankan otomatis setiap jam
  workflow_dispatch:     # Tombol manual untuk testing

jobs:
  scrape-instagram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Requests Library
        run: pip install requests

      - name: Jalankan Script Scraper API Meta
        env:
          # Memanggil kunci rahasia yang telah Anda simpan
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
        run: python scraper.py

      - name: Commit dan Push Hasil JSON Baru
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add output/*.json
          # Jika ada perubahan JSON, maka komit. Jika tidak ada post baru, skip tanpa memunculkan error.
          git commit -m "Auto-update IG Feeds via Meta API" || exit 0
          git push
          # 
